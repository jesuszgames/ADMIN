@if (authService.isAuthenticated()) {
  <div class="app-layout" [class.sidebar-open]="isSidebarOpen()">
    <app-sidebar (click)="toggleSidebar(false)"></app-sidebar>
    <div class="sidebar-backdrop" (click)="toggleSidebar(false)"></div>

    <div class="app-content">
      <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

      <div class="app-main">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}

<!-- Floating Error Toast -->
@if (errorService.connectionError()) {
  <div
    class="alert alert-dismissible fade show rounded-3 shadow-lg p-3 animate-slide-in"
    role="alert"
    style="position: fixed; bottom: 24px; right: 24px; z-index: 11000; min-width: 320px; max-width: 450px; background-color: color-mix(in srgb, var(--container-bg) 95%, #ef4444) !important; border: 1px solid var(--color-danger-border) !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15) !important;"
  >
    <div class="d-flex align-items-start gap-2">
      <i class="bi bi-exclamation-triangle-fill fs-5 lh-1 mt-0.5" style="color: #ef5350;"></i>
      <div style="flex: 1;">
        <strong class="d-block fs-7 mb-1 text-white" style="font-weight: 600;">Error</strong>
        <div class="text-white-50 fs-7" style="word-break: break-word; font-size: 0.825rem; line-height: 1.4;">{{ errorService.connectionError() }}</div>
      </div>
    </div>
    <button type="button" class="btn-close btn-close-white" (click)="errorService.clearError()" aria-label="Close" style="position: absolute; top: 0.75rem; right: 0.5rem;"></button>
  </div>
}
