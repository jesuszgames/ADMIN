<!-- Desktop inline collapse (md and up) -->
<div class="advanced-filters-group mb-3 d-none d-md-block">
  <button
    class="btn advanced-filters-btn d-inline-flex align-items-center justify-content-between w-100"
    [class.active]="selectedStatus && selectedStatus !== 'all'"
    data-bs-toggle="collapse"
    [attr.data-bs-target]="'#collapseFiltrosAvanzados-' + filterId"
    aria-expanded="false"
    [attr.aria-controls]="'collapseFiltrosAvanzados-' + filterId"
  >
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-funnel"></i>
      <span>Filtros Avanzados</span>
      @if (selectedStatus && selectedStatus !== 'all') {
        <span class="badge bg-white text-primary ms-1" style="font-size: 0.75rem;">Activo</span>
      }
    </div>
    <i class="bi bi-chevron-down filter-chevron"></i>
  </button>

  <div class="collapse" [id]="'collapseFiltrosAvanzados-' + filterId">
    <div class="card custom-modal-bg border-secondary border-opacity-25 rounded-3 shadow-lg p-4 position-relative">
      <div class="row align-items-end pe-4">
        <div class="col-12">
          <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Estado</label>
          <ng-select
            class="custom-ng-select"
            [items]="statusOptions"
            bindLabel="label"
            bindValue="id"
            [(ngModel)]="tempStatus"
            placeholder="Seleccionar..."
            [clearable]="false"
          >
          </ng-select>
        </div>
      </div>

      <!-- Acciones abajo (alineadas a la derecha) -->
      <div class="d-flex justify-content-end gap-2 mt-4 pe-4">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary"
          style="min-width: 140px;"
          (click)="onReset()"
        >
          Restablecer
        </button>
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-primary"
          style="min-width: 140px;"
          (click)="onApply()"
        >
          Aplicar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Mobile floating trigger button (under md) -->
<button
  class="btn advanced-filters-btn floating-mobile-filter-btn d-inline-flex d-md-none align-items-center gap-2"
  [class.active]="selectedStatus && selectedStatus !== 'all'"
  data-bs-toggle="offcanvas"
  [attr.data-bs-target]="'#offcanvasFiltrosAvanzados-' + filterId"
>
  <i class="bi bi-funnel"></i>
  <span>Filtros Avanzados</span>
  @if (selectedStatus && selectedStatus !== 'all') {
    <span class="badge bg-white text-primary ms-1" style="font-size: 0.75rem;">Activo</span>
  }
</button>

<!-- Mobile offcanvas (under md) -->
<div class="d-md-none">
  <div
    class="offcanvas offcanvas-end custom-modal-bg border-start border-secondary border-opacity-25 shadow-lg text-white"
    tabindex="-1"
    [id]="'offcanvasFiltrosAvanzados-' + filterId"
    [attr.aria-labelledby]="'offcanvasFiltrosLabel-' + filterId"
    style="max-width: 85vw; width: 340px;"
  >
    <div class="offcanvas-header border-0 pb-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <h5 class="offcanvas-title fw-bold" [id]="'offcanvasFiltrosLabel-' + filterId">Filtros Avanzados</h5>
      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body p-4 pt-3 d-flex flex-column">
      <div class="flex-grow-1">
        <div class="mb-4">
          <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Estado</label>
          <ng-select
            class="custom-ng-select"
            [items]="statusOptions"
            bindLabel="label"
            bindValue="id"
            [(ngModel)]="tempStatus"
            placeholder="Seleccionar..."
            [clearable]="false"
          >
          </ng-select>
        </div>
      </div>

      <div class="d-flex gap-2 pt-4 border-top border-secondary border-opacity-25">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary flex-grow-1"
          (click)="onReset()"
          data-bs-dismiss="offcanvas"
        >
          Restablecer
        </button>
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-primary flex-grow-1"
          (click)="onApply()"
          data-bs-dismiss="offcanvas"
        >
          Aplicar
        </button>
      </div>
    </div>
  </div>
</div>
