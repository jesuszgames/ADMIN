<div class="modal fade" id="modalCrearFundacion" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div
      class="modal-content custom-modal-bg border-secondary border-opacity-25 rounded-3 shadow-lg"
    >
      <div class="modal-body p-4 p-md-5 pb-3">
        <h3 class="text-white fw-bold mb-4 fs-4">
          {{ foundation ? 'Editar Fundacion' : 'Crear Fundacion' }}
        </h3>

        <div class="row g-5">
          <div class="col-lg-7 d-flex flex-column gap-3">
            <div>
              <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                >Nombre Fundacion</label
              >
              <input
                type="text"
                class="form-control custom-dark-input py-2"
                [(ngModel)]="nombre"
                placeholder="ANCHO DE TEXTO PRUEBA DE ESCRITORIO"
                required
              />
            </div>

            <div>
              <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                >Descripcion Fundacion</label
              >
              <textarea
                class="form-control custom-dark-input py-2 desc-textarea w-100"
                [(ngModel)]="descripcion"
                placeholder="ANCHO DE TEXTO PRUEBA DE ESCRITORIO"
                required
              ></textarea>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Correo Electronico</label
                >
                <div class="input-group">
                  <input
                    type="email"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [(ngModel)]="correo"
                    placeholder="example@gmail.com"
                    required
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-envelope"></i>
                  </span>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Numero de Telefono</label
                >
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [(ngModel)]="telefono"
                    placeholder="00-0000-0000-0000"
                    required
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-telephone"></i>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Image Column (Right) -->
          <div class="col-lg-5 d-flex flex-column">
            <label class="form-label text-white-50 text-uppercase fs-7 mb-2 text-center"
              >Imagen</label
            >
            <div
              class="image-container rounded-3 overflow-hidden d-flex flex-column align-items-center justify-content-center p-0 cursor-pointer"
              (click)="fileInput.click()"
              (dragover)="onDragOver($event)"
              (drop)="onDrop($event)"
              style="
                border: 2px dashed rgba(255, 255, 255, 0.15);
                min-height: 250px;
                height: 100%;
                max-height: 380px;
              "
            >
              @if (photo) {
                <img
                  [src]="photo"
                  alt="Imagen de la Fundacion"
                  class="img-fluid object-fit-cover w-100 h-100 rounded-3"
                />
              } @else {
                <div class="text-center p-4">
                  <i class="bi bi-image text-white-50 fs-1 mb-3 d-block"></i>
                  <span class="text-white-50 fs-7">Subir o arrastrar una foto</span>
                </div>
              }
              <input
                #fileInput
                type="file"
                accept="image/*"
                class="d-none"
                (change)="onFileSelected($event)"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer border-0 pt-0 pe-4 pe-md-5 pb-4 pb-md-5 justify-content-end gap-3">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary"
          data-bs-dismiss="modal"
          (click)="resetForm()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-primary"
          [disabled]="!isFormValid()"
          data-bs-dismiss="modal"
          (click)="onSubmit()"
        >
          {{ foundation ? 'Guardar' : 'Crear' }}
        </button>
      </div>
    </div>
  </div>
</div>
