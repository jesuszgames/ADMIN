@if (isModal) {
  <!-- Vista Móvil / Lateral (Offcanvas) -->
  <div
    class="offcanvas offcanvas-end custom-modal-bg border-start border-secondary border-opacity-25 shadow-lg text-white"
    tabindex="-1"
    id="offcanvasFiltrosAvanzados"
    aria-labelledby="offcanvasFiltrosLabel"
    style="max-width: 85vw; width: 340px;"
  >
    <div class="offcanvas-header border-0 pb-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <h5 class="offcanvas-title fw-bold" id="offcanvasFiltrosLabel">Filtros Avanzados</h5>
      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body p-4 pt-3 d-flex flex-column">
      <div class="flex-grow-1">
        <!-- Categoría Select -->
        <div class="mb-4">
          <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Categoría</label>
          <ng-select
            class="custom-ng-select"
            [items]="categories"
            [loading]="categoriesLoading"
            bindLabel="name"
            bindValue="name"
            [(ngModel)]="tempCategory"
            placeholder="Seleccionar..."
            [clearable]="true"
            (open)="loadCategoriesIfNeeded()"
            (search)="onCategorySearch($event)"
            [virtualScroll]="true"
            (scrollToEnd)="loadMoreCategories()"
          >
          </ng-select>
        </div>
        
        <!-- Fundación Select -->
        <div class="mb-4">
          <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Fundación</label>
          <ng-select
            class="custom-ng-select"
            [items]="foundations"
            [loading]="foundationsLoading"
            bindLabel="name"
            bindValue="name"
            [(ngModel)]="tempFoundation"
            placeholder="Seleccionar..."
            [clearable]="true"
            (open)="loadFoundationsIfNeeded()"
            (search)="onFoundationSearch($event)"
            [virtualScroll]="true"
            (scrollToEnd)="loadMoreFoundations()"
          >
          </ng-select>
        </div>

        <!-- Estado Select (Opcional) -->
        @if (statusOptions && statusOptions.length > 0) {
          <div class="mb-4">
            <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Estado</label>
            <ng-select
              class="custom-ng-select"
              [items]="statusOptions"
              bindLabel="label"
              bindValue="id"
              [(ngModel)]="tempStatus"
              placeholder="Seleccionar..."
              [clearable]="false"
            >
            </ng-select>
          </div>
        }
      </div>
      
      <!-- Acciones fijadas abajo -->
      <div class="d-flex gap-2 pt-4 border-top border-secondary border-opacity-25">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary flex-grow-1"
          (click)="clearFilters()"
          data-bs-dismiss="offcanvas"
        >
          Restablecer
        </button>
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-primary flex-grow-1"
          (click)="apply()"
          data-bs-dismiss="offcanvas"
        >
          Aplicar
        </button>
      </div>
    </div>
  </div>
} @else {
  <!-- Vista Desktop (Tarjeta Colapsable) -->
  <div class="card custom-modal-bg border-secondary border-opacity-25 rounded-3 shadow-lg p-4 position-relative">

    <div class="row align-items-end pe-4">
      <!-- Categoría Select -->
      <div class="col-md col-12">
        <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Categoría</label>
        <ng-select
          class="custom-ng-select"
          [items]="categories"
          [loading]="categoriesLoading"
          bindLabel="name"
          bindValue="name"
          [(ngModel)]="tempCategory"
          placeholder="Seleccionar..."
          [clearable]="true"
          (open)="loadCategoriesIfNeeded()"
          (search)="onCategorySearch($event)"
          [virtualScroll]="true"
          (scrollToEnd)="loadMoreCategories()"
        >
        </ng-select>
      </div>

      <!-- Fundación Select -->
      <div class="col-md col-12">
        <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Fundación</label>
        <ng-select
          class="custom-ng-select"
          [items]="foundations"
          [loading]="foundationsLoading"
          bindLabel="name"
          bindValue="name"
          [(ngModel)]="tempFoundation"
          placeholder="Seleccionar..."
          [clearable]="true"
          (open)="loadFoundationsIfNeeded()"
          (search)="onFoundationSearch($event)"
          [virtualScroll]="true"
          (scrollToEnd)="loadMoreFoundations()"
        >
        </ng-select>
      </div>

      <!-- Estado Select (Opcional) -->
      @if (statusOptions && statusOptions.length > 0) {
        <div class="col-md col-12">
          <label class="form-label text-white-50 text-uppercase fs-7 mb-2">Estado</label>
          <ng-select
            class="custom-ng-select"
            [items]="statusOptions"
            bindLabel="label"
            bindValue="id"
            [(ngModel)]="tempStatus"
            placeholder="Seleccionar..."
            [clearable]="false"
          >
          </ng-select>
        </div>
      }
    </div>

    <!-- Acciones abajo (alineadas a la derecha) -->
    <div class="d-flex justify-content-end gap-2 mt-4 pe-4">
      <button
        type="button"
        class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary"
        style="min-width: 140px;"
        (click)="clearFilters()"
      >
        Restablecer
      </button>
      <button
        type="button"
        class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-primary"
        style="min-width: 140px;"
        (click)="apply()"
      >
        Aplicar
      </button>
    </div>
  </div>
}
