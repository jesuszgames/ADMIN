<div class="image-cropper-container rounded-3 h-100 w-100 d-flex flex-column">
  @if (isEditing) {
    <div
      class="cropper-edit-area position-relative w-100 flex-grow-1 overflow-hidden rounded-3"
      #viewport
    >
      <img
        #editImage
        [src]="tempImageSrc"
        crossorigin="anonymous"
        (load)="onImageLoaded()"
        (mousedown)="onMouseDown($event)"
        (touchstart)="onTouchStart($event)"
        [style.width.px]="baseWidth * zoom"
        [style.height.px]="baseHeight * zoom"
        [style.left.px]="imgLeft"
        [style.top.px]="imgTop"
        class="cropper-draggable-image position-absolute"
        alt="Ajustar imagen"
      />
      <div class="cropper-grid-overlay position-absolute w-100 h-100 pointer-events-none">
        <div class="grid-line horizontal-1"></div>
        <div class="grid-line horizontal-2"></div>
        <div class="grid-line vertical-1"></div>
        <div class="grid-line vertical-2"></div>
      </div>
    </div>

    <div
      class="cropper-control-panel d-flex flex-column gap-3 p-3 bg-dark bg-opacity-75 border-top border-secondary border-opacity-25 rounded-bottom-3"
    >
      <div class="zoom-slider-container d-flex align-items-center gap-3">
        <i class="bi bi-zoom-out text-white-50 fs-5"></i>
        <input
          type="range"
          min="1"
          max="3"
          step="0.01"
          [value]="zoom"
          (input)="onZoomChange($event)"
          class="form-range flex-grow-1 custom-zoom-slider"
        />
        <i class="bi bi-zoom-in text-white-50 fs-5"></i>
      </div>

      <div class="cropper-actions d-flex justify-content-end gap-2">
        <button
          type="button"
          (click)="cancelEditing()"
          class="btn btn-sm btn-outline-secondary px-3 py-1.5 rounded-pill d-flex align-items-center gap-1 text-uppercase fs-8"
        >
          <i class="bi bi-x-lg"></i>
          Cancelar
        </button>
        <button
          type="button"
          (click)="cropImage()"
          class="btn btn-sm btn-success px-4 py-1.5 rounded-pill d-flex align-items-center gap-1 text-uppercase fs-8"
        >
          <i class="bi bi-check-lg"></i>
          Aceptar
        </button>
      </div>
    </div>
  } @else {
    @if (photo) {
      <div
        class="cropper-preview-area position-relative w-100 h-100 rounded-3 overflow-hidden group cursor-pointer"
        (click)="triggerFileInput()"
      >
        <img
          [src]="previewUrl"
          crossorigin="anonymous"
          alt="Vista previa"
          class="img-fluid object-fit-cover w-100 h-100 transition-all duration-300"
        />

        @if (!isReadOnly) {
          <div
            class="cropper-hover-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center gap-2 bg-dark bg-opacity-60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none group-hover:pointer-events-auto"
          >
            <button
              type="button"
              (click)="triggerFileInput(); $event.stopPropagation()"
              class="btn btn-light btn-sm rounded-pill px-3 py-2 d-flex align-items-center gap-1 shadow-sm"
              title="Cambiar Imagen"
            >
              <i class="bi bi-upload"></i>
              Cambiar
            </button>
            <button
              type="button"
              (click)="startEditing(); $event.stopPropagation()"
              class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 d-flex align-items-center gap-1 shadow-sm"
              title="Ajustar Encuadre"
            >
              <i class="bi bi-crop"></i>
              Ajustar
            </button>
          </div>

          <!-- Botón flotante siempre visible para ajustar encuadre directamente -->
          <button
            type="button"
            (click)="startEditing(); $event.stopPropagation()"
            class="position-absolute top-3 end-3 btn btn-dark btn-sm rounded-circle d-flex align-items-center justify-content-center p-0 shadow"
            style="width: 38px; height: 38px; background-color: rgba(33, 37, 41, 0.85); border: 1px solid rgba(255, 255, 255, 0.25); z-index: 6;"
            title="Ajustar Encuadre"
          >
            <i class="bi bi-crop text-white fs-6"></i>
          </button>
        }
      </div>
    } @else {
      <div
        class="cropper-empty-area w-100 h-100 d-flex flex-column align-items-center justify-content-center p-4 text-center rounded-3 transition-colors duration-300"
        [class.cursor-pointer]="!isReadOnly"
        (click)="triggerFileInput()"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
      >
        <i class="bi bi-image text-white-50 fs-1 mb-3 d-block bounce-on-hover"></i>
        @if (isReadOnly) {
          <span class="text-white-50 fs-7">Sin imagen disponible</span>
        } @else {
          <span class="text-white-50 fs-7">Subir o arrastrar una foto</span>
          <span class="text-white-50 opacity-50 fs-8 mt-1">Formatos permitidos: PNG, JPG, WEBP</span>
          @if (errorMessage) {
            <div class="text-danger fs-8 mt-2 d-flex flex-column align-items-center gap-2 justify-content-center" style="font-size: 0.75rem; color: #ef5350">
              <span class="d-flex align-items-center gap-1">
                <i class="bi bi-exclamation-triangle-fill"></i>
                {{ errorMessage }}
              </span>
              @if (pendingFileToCompress) {
                <button
                  type="button"
                  (click)="compressPendingFile(); $event.stopPropagation()"
                  [disabled]="isCompressing"
                  class="btn btn-sm btn-outline-warning rounded-pill px-3 py-1 mt-1 d-flex align-items-center gap-1 shadow-sm text-uppercase fs-9"
                  style="border-color: #ffb74d; color: #ffb74d; font-size: 0.7rem; background: transparent;"
                >
                  @if (isCompressing) {
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Comprimiendo...
                  } @else {
                    <i class="bi bi-file-earmark-zip"></i>
                    Comprimir y continuar
                  }
                </button>
              }
            </div>
          }
        }
      </div>
    }
  }

  <input #fileInput type="file" accept="image/*" class="d-none" (change)="onFileSelected($event)" />
</div>
