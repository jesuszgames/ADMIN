<div
  class="modal fade custom-modal"
  id="modal-{{ id }}"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="modal-{{ id }}"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body text-center p-5">
        <h4 class="modal-title mb-3 text-white fw-bold" id="modal-{{ id }}">¿Eliminar registro?</h4>
        <p class="text-white mb-0">
          Esta acción no se puede deshacer. Se borrarán permanentemente todos los datos asociados.
        </p>
      </div>
      <div class="modal-footer border-0 justify-content-center pb-4 pt-0 gap-3">
        <button type="button" class="btn btn-cancel px-4" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger-custom px-4" data-bs-dismiss="modal">
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</div>
