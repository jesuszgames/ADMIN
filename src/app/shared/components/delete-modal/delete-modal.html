<div
  class="modal fade custom-modal"
  id="modal-{{ id }}"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="modal-{{ id }}"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body text-center p-5 pb-4">
        <h4 class="modal-title mb-3 text-white fw-bold" id="modal-{{ id }}">¿Eliminar registro?</h4>
        <p class="text-white mb-4">Esta acción no se puede deshacer.</p>
        <div class="text-start mt-3">
          <label
            [attr.for]="'razon-' + id"
            class="form-label text-white-50 text-uppercase fs-8 fw-semibold mb-2"
            >Razón de eliminación</label
          >
          <textarea
            [attr.id]="'razon-' + id"
            class="form-control custom-dark-input w-100"
            rows="3"
            placeholder="Escribe el motivo de la eliminación..."
            [(ngModel)]="razon"
          ></textarea>
        </div>
      </div>
      <div class="modal-footer border-0 justify-content-center pb-4 pt-0 gap-3">
        <button type="button" class="btn btn-cancel px-4" data-bs-dismiss="modal">Cancelar</button>
        <button
          type="button"
          class="btn btn-danger-custom px-4"
          data-bs-dismiss="modal"
          (click)="onConfirm()"
          [disabled]="!razon || !razon.trim()"
        >
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</div>
