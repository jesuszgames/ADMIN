<aside class="sidebar-content">
  <div class="sidebar-content__logo">
    <img src="/assets/img/image.png" alt="Logo" />
    <span class="sidebar-content__brand"></span>
  </div>
  <nav class="sidebar-content__nav">
    <ul class="sidebar-content__menu">
      <li class="sidebar-content__item">
        @if (userRole !== 'SORTEADOR') {
          <a routerLink="/dashboard" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/dashboard.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Dashboard</span>
          </a>
          <a routerLink="/raffles" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/tickets.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Mis Rifas</span>
          </a>
          <a routerLink="/users" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/user.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Usuarios</span>
          </a>
          <a routerLink="/foundations" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/foundation.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Fundaciones</span>
          </a>
          <a routerLink="/categories" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/category.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Categorias</span>
          </a>
          <a routerLink="/history" routerLinkActive="is-active" class="sidebar-content__link">
            <img src="/assets/icon/history.svg" class="sidebar-content__icon" />
            <span class="sidebar-content__text">Historial</span>
          </a>
        }
        <div class="sidebar-content__divider my-3" style="border-top: 1px solid var(--border-color); opacity: 0.15; margin-left: 24px; margin-right: 24px;"></div>
        <a routerLink="/draws" routerLinkActive="is-active" class="sidebar-content__link">
          <i class="bi bi-trophy sidebar-content__icon text-secondary" style="font-size: 1.25rem;"></i>
          <span class="sidebar-content__text">Sorteos</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-content__footer">
    <a (click)="logout()" class="sidebar-content__link sidebar-content__link--logout" style="cursor: pointer;">
      <i class="bi bi-box-arrow-right sidebar-content__icon sidebar-content__icon--logout"></i>
      <span class="sidebar-content__text">Cerrar Sesión</span>
    </a>
  </div>
</aside>
