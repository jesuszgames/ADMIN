<div class="modal fade" id="modalHistorialBoletos" tabindex="-1" aria-hidden="true" (hidden.bs.modal)="onModalClosed()">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div
      class="modal-content custom-modal-bg border-secondary border-opacity-25 rounded-3 shadow-lg position-relative"
    >
      <button
        type="button"
        class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
        data-bs-dismiss="modal"
        aria-label="Close"
        style="z-index: 1055;"
      ></button>
      <div class="modal-body p-4 p-md-5 pb-3">
        <div class="row g-5">
          <div class="col-lg-6">
            <h3 class="text-white fw-bold mb-4 fs-4">Historial Boletos</h3>
            <div class="ticket-grid mb-3" [class.loading-fade]="loading && !showSkeleton">
              @if (showSkeleton) {
                @for (placeholder of [].constructor(100); track $index) {
                  <div class="ticket-skeleton"></div>
                }
              } @else {
                @for (ticket of pagedTickets; track ticket.number) {
                  <button
                    type="button"
                    class="ticket-btn"
                    [ngClass]="{
                      'ticket-seleccionado': ticket.status === 'selected',
                      'ticket-ganador': ticket.status === 'winner',
                    }"
                  >
                    {{ ticket.number }}
                  </button>
                }
              }
            </div>
            @if (totalPages > 1 && !showSkeleton) {
              <div class="custom-paginator-bar">
                <button
                  type="button"
                  class="btn custom-paginator-btn"
                  [disabled]="currentPage === 1"
                  (click)="prevPage()"
                >
                  <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <span>
                  Página <strong>{{ currentPage }}</strong> de <strong>{{ totalPages }}</strong>
                </span>
                <button
                  type="button"
                  class="btn custom-paginator-btn"
                  [disabled]="currentPage === totalPages"
                  (click)="nextPage()"
                >
                  Siguiente <i class="bi bi-chevron-right"></i>
                </button>
              </div>
            }
          </div>

          <div class="col-lg-6 pt-lg-5">
            <div class="row g-4 mb-3">
              <div class="col-12">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Nombre Ganador</label
                >
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [value]="ticketData?.winnerName"
                    readonly
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-person"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="row g-4 mb-3">
              <div class="col-md-6 d-flex flex-column">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Boletos Comprados</label
                >
                <div class="input-group mt-auto">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [value]="ticketData?.ticketsPurchased"
                    readonly
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-hash fs-5"></i>
                  </span>
                </div>
              </div>

              <div class="col-md-6 d-flex flex-column">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Todos los números asociados</label
                >
                <div class="input-group mt-auto">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [value]="ticketData?.associatedNumbers"
                    readonly
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-hash fs-5"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="row g-4 mb-3">
              <div class="col-md-6 d-flex flex-column">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Boleto Ganador</label
                >
                <div class="input-group mt-auto">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [value]="ticketData?.winnerTicket"
                    readonly
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-hash fs-5"></i>
                  </span>
                </div>
              </div>

              <div class="col-md-6 d-flex flex-column">
                <label class="form-label text-white-50 text-uppercase fs-7 mb-2"
                  >Fecha compra de último boleto</label
                >
                <div class="input-group mt-auto">
                  <input
                    type="text"
                    class="form-control custom-dark-input border-end-0 py-2"
                    [value]="ticketData?.lastPurchaseDate"
                    readonly
                  />
                  <span class="input-group-text custom-dark-addon border-start-0 text-white-50">
                    <i class="bi bi-calendar"></i>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer border-0 pt-0 pe-4 pe-md-5 justify-content-end mt-4">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary"
          data-bs-dismiss="modal"
        >
          CERRAR
        </button>
      </div>
    </div>
  </div>
</div>
