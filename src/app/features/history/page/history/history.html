<div class="container-fluid px-3 pt-5 pb-4 mt-4 fade-in-up">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Historial de rifas</h3>
  </div>
  <!-- Advanced Filters Group (Desktop) -->
  <div class="advanced-filters-group mb-3 d-none d-md-block">
    <!-- Trigger Button for Desktop (Collapse) -->
    <button
      class="btn advanced-filters-btn d-inline-flex align-items-center justify-content-between w-100"
      [class.active]="selectedCategory || selectedFoundation || (filtroActual && filtroActual !== 'all')"
      data-bs-toggle="collapse"
      data-bs-target="#collapseFiltrosAvanzados"
      aria-expanded="false"
      aria-controls="collapseFiltrosAvanzados"
    >
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-funnel"></i>
        <span>Filtros Avanzados</span>
        @if (selectedCategory || selectedFoundation || (filtroActual && filtroActual !== 'all')) {
          <span class="badge bg-white text-primary ms-1" style="font-size: 0.75rem;">Activo</span>
        }
      </div>
      <i class="bi bi-chevron-down filter-chevron"></i>
    </button>

    <!-- Collapsible Advanced Filters (Desktop) -->
    <div class="collapse" id="collapseFiltrosAvanzados">
      <app-advanced-filters-modal
        [isModal]="false"
        [selectedCategory]="selectedCategory"
        [selectedFoundation]="selectedFoundation"
        [statusOptions]="historyFilters"
        [selectedStatus]="filtroActual"
        (filterApplied)="onFiltersApplied($event)"
      ></app-advanced-filters-modal>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="'Lista rifas'"
        [columns]="historyColumns"
        [data]="tableData"
        [rowActions]="historyActions"
        [serverSide]="true"
        [totalItems]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [loading]="loading"
        [placeholderSearch]="'Buscar nombre rifa'"
        (actionClicked)="manejarAccion($event)"
        (pageChanged)="onPageChanged($event)"
        (searchChanged)="onSearchChanged($event)"
        (refreshData)="cargarRifas()"
      >
      </app-tables>
    </div>
  </div>
</div>

<!-- Trigger Button for Mobile (Offcanvas) -->
<button
  class="btn advanced-filters-btn floating-mobile-filter-btn d-inline-flex d-md-none align-items-center gap-2"
  [class.active]="selectedCategory || selectedFoundation || (filtroActual && filtroActual !== 'all')"
  data-bs-toggle="offcanvas"
  data-bs-target="#offcanvasFiltrosAvanzados"
>
  <i class="bi bi-funnel"></i>
  <span>Filtros Avanzados</span>
  @if (selectedCategory || selectedFoundation || (filtroActual && filtroActual !== 'all')) {
    <span class="badge bg-white text-primary ms-1" style="font-size: 0.75rem;">Activo</span>
  }
</button>

<!-- Mobile Offcanvas -->
<div class="d-md-none">
  <app-advanced-filters-modal
    [isModal]="true"
    [selectedCategory]="selectedCategory"
    [selectedFoundation]="selectedFoundation"
    [statusOptions]="historyFilters"
    [selectedStatus]="filtroActual"
    (filterApplied)="onFiltersApplied($event)"
  ></app-advanced-filters-modal>
</div>

<app-delete-modal
  [id]="'eliminar-historial'"
  (confirmDelete)="confirmarEliminar($event)"
></app-delete-modal>
<button
  id="btn-abrir-modal-delete-history"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-historial"
  hidden
></button>

<button
  id="btn-abrir-modal-history"
  data-bs-toggle="modal"
  data-bs-target="#modalDetalleRifa"
  hidden
></button>
<app-history-raffles-modal [raffleData]="selectedRaffle"></app-history-raffles-modal>

<button
  id="btn-abrir-modal-tickets"
  data-bs-toggle="modal"
  data-bs-target="#modalHistorialBoletos"
  hidden
></button>
<app-history-ticket-model [ticketData]="selectedTicketData"></app-history-ticket-model>

<button
  id="btn-abrir-modal-unlink-logs"
  data-bs-toggle="modal"
  data-bs-target="#modalVerDesvinculaciones"
  hidden
></button>

<div class="modal fade" id="modalVerDesvinculaciones" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div
      class="modal-content custom-modal-bg border-secondary border-opacity-25 rounded-3 shadow-lg"
    >
      <div
        class="modal-header border-0 pb-0 pt-4 px-4 px-md-5 d-flex justify-content-between align-items-center"
      >
        <h5 class="modal-title text-white fw-bold">Bitácora de Desvinculaciones</h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body p-4 p-md-5 pt-3 pb-3">
        <app-unlink-logs [raffleData]="selectedRaffleForLogs"></app-unlink-logs>
      </div>
      <div class="modal-footer border-0 pt-0 pe-4 pe-md-5 pb-4 pb-md-5 justify-content-end">
        <button
          type="button"
          class="btn px-4 py-2 rounded-3 text-uppercase fs-7 custom-btn-secondary"
          data-bs-dismiss="modal"
        >
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
