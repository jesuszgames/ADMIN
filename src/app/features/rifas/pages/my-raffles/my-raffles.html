<div class="container-fluid px-3 pt-5 pb-4 mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Rifas activas</h3>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <app-filter [options]="misFiltrosRifas" (onFilter)="filtrarPorCategoria($event)"></app-filter>
    <app-main-button
      [label]="'Crear Rifa'"
      [icon]="'bi-plus'"
      (click)="abrirCrearRifa()"
    ></app-main-button>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="principalHeader"
        [columns]="dashboardColumns"
        [data]="tableData"
        (actionClicked)="manejarAccion($event)"
      >
      </app-tables>
    </div>
  </div>
</div>

<app-delete-modal [id]="'eliminar-rifa'" (confirmDelete)="confirmarEliminar()"></app-delete-modal>
<button
  id="btn-abrir-modal-delete-raffle"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-rifa"
  hidden
></button>

<button
  id="btn-abrir-modal-create-raffle"
  data-bs-toggle="modal"
  data-bs-target="#modalCrearRifa"
  hidden
></button>
<app-create-raffle-modal
  [raffle]="selectedRaffleForEdit"
  (save)="onSaveRaffle($event)"
></app-create-raffle-modal>

<button
  id="btn-abrir-modal-edit-tickets"
  data-bs-toggle="modal"
  data-bs-target="#modalEditarBoletos"
  hidden
></button>
<app-edit-tickets-modal
  [raffle]="selectedRaffleForTickets"
  (save)="onSaveTickets($event)"
></app-edit-tickets-modal>
