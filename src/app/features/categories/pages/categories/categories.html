<div class="container-fluid px-3 pt-5 pb-4 mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Categorias</h3>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <app-filter [options]="categoriesFilters" (onFilter)="filtrarPorCategoria($event)"></app-filter>
    <app-main-button
      [label]="'Crear Categoría'"
      [icon]="'bi-plus'"
      (btnClick)="abrirCrearCategoria()"
    ></app-main-button>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="'Lista categorias'"
        [columns]="categoriesColumns"
        [data]="tableData"
        [rowActions]="categoriesActions"
        (actionClicked)="manejarAccion($event)"
      >
      </app-tables>
    </div>
  </div>
</div>

<app-delete-modal
  [id]="'eliminar-categoria'"
  (confirmDelete)="confirmarEliminar()"
></app-delete-modal>
<button
  id="btn-abrir-modal-delete-category"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-categoria"
  hidden
></button>

<app-create-category-modal
  [category]="selectedCategoryForEdit"
  (save)="onSaveCategory($event)"
></app-create-category-modal>
<button
  id="btn-abrir-modal-create-category"
  data-bs-toggle="modal"
  data-bs-target="#modalCrearCategoria"
  hidden
></button>
