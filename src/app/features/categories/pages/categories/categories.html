<div class="container-fluid px-3 pt-5 pb-4 mt-4 fade-in-up">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Categorias</h3>
    <app-main-button
      [label]="'Crear Categoría'"
      [icon]="'bi-plus'"
      (btnClick)="abrirCrearCategoria()"
    ></app-main-button>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="'Lista categorias'"
        [columns]="categoriesColumns"
        [data]="tableData"
        [rowActions]="categoriesActions"
        [loading]="loading"
        [placeholderSearch]="'Buscar nombre categoría'"
        [serverSide]="true"
        [totalItems]="totalCount"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [showStatusFilter]="true"
        [statusOptions]="statusOptions"
        [selectedStatus]="selectedStatus"
        (statusChanged)="applyFilters($event)"
        (pageChanged)="onPageChanged($event)"
        (searchChanged)="onSearchChanged($event)"
        (actionClicked)="manejarAccion($event)"
        (refreshData)="loadCategories()"
      >
      </app-tables>
    </div>
  </div>
</div>

@if (showDeleteModal) {
  <app-delete-modal
    [id]="'eliminar-categoria'"
    (confirmDelete)="confirmarEliminar($event)"
    (closed)="onCloseDeleteModal()"
  ></app-delete-modal>
  <button
    id="btn-abrir-modal-delete-category"
    data-bs-toggle="modal"
    data-bs-target="#modal-eliminar-categoria"
    hidden
  ></button>
}

@if (showCreateModal) {
  <app-create-category-modal
    [category]="selectedCategoryForEdit"
    [isReadOnly]="isReadOnlyView"
    [isSaving]="isCategorySaving"
    (save)="onSaveCategory($event)"
    (closed)="onCloseCreateCategory()"
  ></app-create-category-modal>
  <button
    id="btn-abrir-modal-create-category"
    data-bs-toggle="modal"
    data-bs-target="#modalCrearCategoria"
    hidden
  ></button>
}

<app-confirm-changes-modal
  [title]="'Confirmar Cambio de Estado'"
  [changes]="changesToConfirm"
  [isOpen]="showConfirmModal"
  (confirm)="confirmarCambioEstado()"
  (cancel)="cancelarCambioEstado()"
></app-confirm-changes-modal>
