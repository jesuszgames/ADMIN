<div class="login-wrapper">
  <div class="login-card">
    <div class="sidebar-content__logo justify-content-center">
      <img src="/assets/img/image.png" alt="Logo" />
    </div>
    <div class="login-card__header">
      <form (ngSubmit)="onSubmit()" class="login-card__form" #loginForm="ngForm" autocomplete="off">
        @if (errorMessage()) {
          <div class="login-card__error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <i class="bi bi-person-fill input-icon"></i>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="username"
              placeholder="Introduce tu usuario"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Introduce tu contraseña"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" class="btn-login" [disabled]="!loginForm.valid">
          <span>Iniciar Sesión</span>
          <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </form>
    </div>
  </div>
</div>
