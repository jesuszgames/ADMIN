<div class="container-fluid px-3 pt-5 pb-4 mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Staff / Administradores</h3>
  </div>
  <!-- Tabs for switching views -->
  <ul class="nav nav-tabs border-secondary border-opacity-25 mb-4" id="userTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        class="nav-link text-uppercase fs-7 fw-semibold py-2 px-4"
        [class.active]="activeTab === 'staff'"
        [class.text-white]="activeTab === 'staff'"
        [class.text-white-50]="activeTab !== 'staff'"
        style="background: transparent; border: none; border-bottom: 2px solid transparent;"
        [style.border-bottom-color]="activeTab === 'staff' ? '#3182ce' : 'transparent'"
        (click)="cambiarTab('staff')"
        type="button"
      >
        Staff de Operación
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link text-uppercase fs-7 fw-semibold py-2 px-4"
        [class.active]="activeTab === 'player'"
        [class.text-white]="activeTab === 'player'"
        [class.text-white-50]="activeTab !== 'player'"
        style="background: transparent; border: none; border-bottom: 2px solid transparent;"
        [style.border-bottom-color]="activeTab === 'player' ? '#3182ce' : 'transparent'"
        (click)="cambiarTab('player')"
        type="button"
      >
        Jugadores / Compradores
      </button>
    </li>
  </ul>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <app-filter [options]="misFiltrosUsuarios" (onFilter)="filtrarPorEstado($event)"></app-filter>
    @if (activeTab === 'staff') {
      <app-main-button
        [label]="'Crear Staff'"
        [icon]="'bi-plus'"
        (btnClick)="abrirCrearStaff()"
      ></app-main-button>
    }
  </div>
  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="principalHeader"
        [columns]="usersColumns"
        [data]="tableData"
        [rowActions]="userRowActions"
        [loading]="loading"
        [serverSide]="true"
        [totalItems]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        (actionClicked)="manejarAccion($event)"
        (pageChanged)="onPageChange($event)"
        (searchChanged)="onSearchChange($event)"
      >
      </app-tables>
    </div>
  </div>
</div>

<app-delete-modal [id]="'eliminar-user'" (confirmDelete)="confirmarEliminar($event)"></app-delete-modal>
<button
  id="btn-abrir-modal-delete-user"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-user"
  hidden
></button>

<app-edit-user-modal
  [user]="selectedUserForEdit"
  [isReadOnly]="isReadOnlyView"
  [isSaving]="isUserSaving"
  (save)="onSaveUser($event)"
  (closed)="selectedUserForEdit = null"
></app-edit-user-modal>
<button
  id="btn-abrir-modal-edit-user"
  data-bs-toggle="modal"
  data-bs-target="#modalEditarUsuario"
  hidden
></button>

<app-confirm-changes-modal
  [title]="'Confirmar Cambio de Estado'"
  [changes]="changesToConfirm"
  [isOpen]="showConfirmModal"
  (confirm)="confirmarCambioEstado()"
  (cancel)="cancelarCambioEstado()"
></app-confirm-changes-modal>
