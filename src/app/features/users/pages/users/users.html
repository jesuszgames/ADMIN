<div class="container-fluid px-3 pt-5 pb-4 mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Usuarios</h3>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <app-filter [options]="misFiltrosUsuarios" (onFilter)="filtrarPorEstado($event)"></app-filter>
  </div>
  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="principalHeader"
        [columns]="usersColumns"
        [data]="tableData"
        [rowActions]="userRowActions"
        (actionClicked)="manejarAccion($event)"
      >
      </app-tables>
    </div>
  </div>
</div>

<app-delete-modal [id]="'eliminar-user'" (confirmDelete)="confirmarEliminar($event)"></app-delete-modal>
<button
  id="btn-abrir-modal-delete-user"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-user"
  hidden
></button>

<app-edit-user-modal
  [user]="selectedUserForEdit"
  [isReadOnly]="isReadOnlyView"
  (save)="onSaveUser($event)"
></app-edit-user-modal>
<button
  id="btn-abrir-modal-edit-user"
  data-bs-toggle="modal"
  data-bs-target="#modalEditarUsuario"
  hidden
></button>

<app-confirm-changes-modal
  [title]="'Confirmar Cambio de Estado'"
  [changes]="changesToConfirm"
  [isOpen]="showConfirmModal"
  (confirm)="confirmarCambioEstado()"
  (cancel)="cancelarCambioEstado()"
></app-confirm-changes-modal>
