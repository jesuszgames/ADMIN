<div class="container-fluid px-3 pt-5 pb-4 mt-4 fade-in-up">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0 text-theme-primary fw-bold">Sorteos de Rifas</h3>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="'Lista de Rifas para Sorteos'"
        [columns]="columns"
        [data]="tableData"
        [rowActions]="rowActions"
        [loading]="loading"
        [placeholderSearch]="'Buscar nombre rifa'"
        (actionClicked)="manejarAccion($event)"
        (refreshData)="cargarDatos()"
      >
      </app-tables>
    </div>
  </div>
</div>

@if (showTicketsModal) {
  <button
    id="btn-abrir-modal-edit-tickets"
    data-bs-toggle="modal"
    data-bs-target="#modalEditarBoletos"
    hidden
  ></button>

  <app-edit-tickets-modal
    [raffle]="selectedRaffleForTickets"
    [mode]="'sorteos'"
    (save)="onSaveTickets($event)"
    (closed)="onCloseTicketsModal()"
  ></app-edit-tickets-modal>
}
