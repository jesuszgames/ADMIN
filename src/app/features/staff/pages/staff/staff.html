<div class="container-fluid px-3 pt-5 pb-4 mt-4 fade-in-up">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0 text-theme-primary fw-bold">Staff / Administradores</h3>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <app-filter [options]="filters" (onFilter)="filtrarPorEstado($event)"></app-filter>
    <app-main-button
      [label]="'Crear Staff'"
      [icon]="'bi-plus'"
      (btnClick)="abrirCrearStaff()"
    ></app-main-button>
  </div>
  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="'Lista Staff / Administradores'"
        [columns]="columns"
        [data]="tableData"
        [rowActions]="rowActions"
        [loading]="loading"
        [serverSide]="true"
        [totalItems]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [placeholderSearch]="'Buscar por nombre, usuario o correo...'"
        (actionClicked)="manejarAccion($event)"
        (pageChanged)="onPageChange($event)"
        (searchChanged)="onSearchChange($event)"
      >
      </app-tables>
    </div>
  </div>
</div>

<app-delete-modal [id]="'eliminar-user'" (confirmDelete)="confirmarEliminar($event)"></app-delete-modal>
<button
  id="btn-abrir-modal-delete-user"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar-user"
  hidden
></button>

<app-edit-user-modal
  [user]="selectedUserForEdit"
  [isReadOnly]="isReadOnlyView"
  [isSaving]="isUserSaving"
  (save)="onSaveUser($event)"
  (closed)="selectedUserForEdit = null"
></app-edit-user-modal>
<button
  id="btn-abrir-modal-edit-user"
  data-bs-toggle="modal"
  data-bs-target="#modalEditarUsuario"
  hidden
></button>

<app-confirm-changes-modal
  [title]="'Confirmar Cambio de Estado'"
  [changes]="changesToConfirm"
  [isOpen]="showConfirmModal"
  (confirm)="confirmarCambioEstado()"
  (cancel)="cancelarCambioEstado()"
></app-confirm-changes-modal>
