<div class="container-fluid px-3 pt-5 pb-4 mt-4">
  <h3>Dashboard</h3>
  <div class="row align-items-stretch mb-4 g-4">
    <div class="col-12 col-xl-6">
      <div
        class="container-info-color rounded-3 p-4 h-100 d-flex flex-column justify-content-center"
      >
        <div class="card-body">
          <h4 class="card-title text-white fw-bold mb-2">Bienvenido {{ userName }}</h4>
          <p class="card-text text-secondary-text mb-4">Esto es lo que está pasando hoy</p>
          <a href="#" class="btn btn-primary px-4 py-2" style="max-width: max-content"
            >Ver perfil</a
          >
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-6">
      <div class="row row-cols-2 row-cols-sm-3 g-3 h-100 align-content-start">
        @for (item of cards; track item.label) {
          <div class="col">
            <app-simple-card [name]="item.label" [value]="item.value"></app-simple-card>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="principalHeader"
        [columns]="dashboardColumns"
        [data]="tableData"
        [rowActions]="dashboardActions"
        (actionClicked)="manejarAccion($event)"
        [pageSize]="pageSize"
      >
      </app-tables>
    </div>
  </div>
</div>

<button
  id="btn-abrir-modal-history"
  data-bs-toggle="modal"
  data-bs-target="#modalDetalleRifa"
  hidden
></button>
<app-delete-modal [id]="'eliminar'" (confirmDelete)="confirmarEliminar()"></app-delete-modal>
<button
  id="btn-abrir-modal-delete"
  data-bs-toggle="modal"
  data-bs-target="#modal-eliminar"
  hidden
></button>
<app-history-raffles-modal [raffleData]="selectedRaffle"></app-history-raffles-modal>

<button
  id="btn-abrir-modal-tickets"
  data-bs-toggle="modal"
  data-bs-target="#modalHistorialBoletos"
  hidden
></button>
<app-history-ticket-model [ticketData]="selectedTicketData"></app-history-ticket-model>
