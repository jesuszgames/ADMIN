<div class="container-fluid px-3 pt-5 pb-4 mt-4 fade-in-up">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="m-0">Fundaciones</h3>
    <app-main-button
      [label]="'Crear Fundación'"
      [icon]="'bi-plus'"
      (btnClick)="abrirCrearFundacion()"
    ></app-main-button>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tables
        [principalheader]="principalHeader"
        [columns]="foundationColumns"
        [data]="tableData"
        [rowActions]="foundationActions"
        [loading]="loading"
        [placeholderSearch]="'Buscar nombre fundación'"
        [serverSide]="true"
        [totalItems]="totalCount"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [showStatusFilter]="true"
        [statusOptions]="statusOptions"
        [selectedStatus]="selectedStatus"
        (statusChanged)="applyFilters($event)"
        (pageChanged)="onPageChanged($event)"
        (searchChanged)="onSearchChanged($event)"
        (actionClicked)="manejarAccion($event)"
        (refreshData)="loadFoundations()"
      >
      </app-tables>
    </div>
  </div>
</div>

@if (showDeleteModal) {
  <app-delete-modal
    [id]="'eliminar-fundacion'"
    (confirmDelete)="confirmarEliminar($event)"
    (closed)="onCloseDeleteModal()"
  ></app-delete-modal>
  <button
    id="btn-abrir-modal-delete-foundation"
    data-bs-toggle="modal"
    data-bs-target="#modal-eliminar-fundacion"
    hidden
  ></button>
}

@if (showCreateModal) {
  <app-create-foundation-modal
    [foundation]="selectedFoundationForEdit"
    [isReadOnly]="isReadOnlyView"
    [isSaving]="isFoundationSaving"
    (save)="onSaveFoundation($event)"
    (closed)="onCloseCreateFoundation()"
  ></app-create-foundation-modal>
  <button
    id="btn-abrir-modal-create-foundation"
    data-bs-toggle="modal"
    data-bs-target="#modalCrearFundacion"
    hidden
  ></button>
}

<app-confirm-changes-modal
  [title]="'Confirmar Cambio de Estado'"
  [changes]="changesToConfirm"
  [isOpen]="showConfirmModal"
  (confirm)="confirmarCambioEstado()"
  (cancel)="cancelarCambioEstado()"
></app-confirm-changes-modal>
